services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: careerlensai-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=sqlite:////app/data/sessions.db
      - PYTHONUNBUFFERED=1
      - HF_HUB_OFFLINE=1
    volumes:
      - backend_data:/app/data
      - ./backend/app:/app/app:ro
      - /home/sudhanshu/.cache/huggingface:/home/appuser/.cache/huggingface:ro
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: "http://192.168.24.52:8000/api/v1"
    container_name: careerlensai-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  backend_data:
    driver: local

networks:
  app-network:
    driver: bridge
