[project]
name = "careerlens-ai"
version = "0.1.0"
description = "CareerLens AI multi-agent backend"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.137.2",
    "google-search-results>=2.4.2",
    "httpx>=0.28.1",
    "langchain>=1.3.9",
    "langchain-community>=0.4.2",
    "langchain-core>=1.4.7",
    "langchain-groq>=1.1.3",
    "langchain-openrouter>=0.2.7",
    "langgraph>=1.2.5",
    "laya>=0.3.5",
    "pdfplumber>=0.11.10",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "pytest>=9.1.0",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "requests>=2.32.0",
    "serpapi>=1.0.2",
    "sqlalchemy>=2.0.38",
    "tavily-python>=0.7.26",
    "torch",
    "uvicorn>=0.49.0",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
