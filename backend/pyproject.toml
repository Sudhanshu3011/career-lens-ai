[project]
name = "careerlens-ai"
version = "0.1.0"
description = "CareerLens AI multi-agent backend"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.137.2",
    "httpx>=0.28.1",
    "laya>=0.3.5",
    "pdfplumber>=0.11.10",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "pytest>=9.1.0",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "requests>=2.32.0",
    "sqlalchemy>=2.0.38",
    "torch",
    "typesafe-sdk>=0.7.2",
    "uvicorn>=0.49.0",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
